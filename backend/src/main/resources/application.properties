spring.application.name=SmartStock
server.port=${SERVER_PORT:8080}

# --- Database ---
# No credentials live in this file: DB_PASSWORD and JWT_SECRET_KEY have no default,
# so the application refuses to start until they are provided (see .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "update" is convenient for local development; use "validate" in production.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# --- Security ---
# Base64 encoded HMAC key, at least 256 bits. Generate with: openssl rand -base64 48
jwt.secret.key=${JWT_SECRET_KEY}
# Comma separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smartstock.roeiduenyas.me,http://localhost:3000}
# Creates a demo/demo account on startup. Keep it off outside of demos.
app.demo-user.enabled=${DEMO_USER_ENABLED:false}

# --- Operations ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
